# ---------------------------------------------------------------------------
#  Cybersicherheit – Unterrichtseinheit (5 Lektionen)
#  Jekyll-Konfiguration für GitHub Pages
# ---------------------------------------------------------------------------

title: "Cybersicherheit"
untertitel: "Unterrichtseinheit in 5 Lektionen"
description: "Materialien zur Unterrichtseinheit Cybersicherheit (2. Kanti, Informatik) – Arbeitsblätter, Musterlösungen und Ablaufpläne."
lang: "de-CH"

# WICHTIG ------------------------------------------------------------------
# baseurl muss dem Repository-Namen entsprechen, wenn die Seite unter
#   https://<username>.github.io/<repo-name>/  läuft (= Normalfall).
# Heisst das Repo z. B. "Cybersicherheit", muss hier "/Cybersicherheit" stehen.
# Nur bei einem Repo namens "<username>.github.io" bleibt der Wert leer ("").
baseurl: "/Cybersicherheit"
url: ""
# ---------------------------------------------------------------------------

# Fusszeile
schule: "Neue Kantonsschule Aarau"
fach: "Informatik, 2. Kanti"

markdown: kramdown
kramdown:
  input: GFM              # aktiviert u. a. Task-Listen  - [ ] / - [x]
  hard_wrap: false
  syntax_highlighter: rouge

plugins:
  - jekyll-sitemap

# Beschriftung der Material-Typen (Badges + Listen).
# Neuer Typ? Hier ergänzen und im Frontmatter der Datei "art:" setzen.
art_labels:
  ablaufplan:    "Ablaufplan"
  arbeitsblatt:  "Arbeitsblatt"
  musterloesung: "Musterlösung"
  glossar:       "Glossar"
  info:          "Information"
  input:         "Theorie-Input"
  auftrag:       "Auftrag"
  konzept:       "Konzept"

# Alle Dateien in lektionen/ sind Unterrichtsmaterial und teilen dasselbe Layout.
defaults:
  - scope:
      path: "lektionen"
      type: "pages"
    values:
      layout: "material"
      typ: "material"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .gitignore
